# .doc-sync-rules.yml — Flask 项目预设
# v2.9.0 L2 项目级纪律（由 mcpowers-doc-sync-install 注入）
#
# 三类内置规则（详见 scripts/check-doc-sync.sh 注释）：
#   route_in_doc / env_in_doc / path_in_doc
#
# 用法：
#   - 复制本文件到项目根为 .doc-sync-rules.yml
#   - 修改 code_dir / doc_file 等路径匹配你的项目布局
#   - 跑 bash scripts/check-doc-sync.sh 验证
#
# 关键约定：所有 doc_file 路径相对项目根；code_dir 用 find 递归扫描

# 规则 1：Flask @app.route 中定义的所有路径必须在 docs/api.md 中被提及
RULE_START flask_routes
enabled=true
type=route_in_doc
code_dir=app
code_ext=py
code_regex=@app\.route\(['"]([^'"]+)['"]
doc_file=docs/api.md
RULE_END

# 规则 2：.env.example 中所有 KEY 必须在 README.md 中被提及
RULE_START env_keys
enabled=true
type=env_in_doc
env_file=.env.example
code_regex=^([A-Z][A-Z0-9_]+)=
doc_file=README.md
RULE_END

# 规则 3：README.md 中提到 scripts/*.sh 路径必须真实存在
RULE_START readme_paths
enabled=true
type=path_in_doc
doc_file=README.md
RULE_END
