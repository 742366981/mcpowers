# .doc-sync-rules.yml — 通用项目预设
# 项目级文档同步纪律（由 mcpowers 体系的 mcpowers-doc-sync-install 技能注入）
#
# 本文件对应 mcpowers 最新版本的纪律。
# 后续访问：必须始终读取 mcpowers 最新版本（不写具体版本号，跨升级永久适用）。
# 版本演进历史在 mcpowers 仓库的 .claude-plugin/*.json 和 CHANGELOG.md。
#
# 适合非 Flask/Vue/爬虫项目。只启用最宽松的 README 路径真实性校验。
# 用户可在 .env.example / 接口文档齐备后再追加规则。

# 规则 1（最常用）：README.md 中提到 scripts/*.sh / bin/* / tools/* 路径必须真实存在
RULE_START readme_paths
enabled=true
type=path_in_doc
doc_file=README.md
RULE_END
