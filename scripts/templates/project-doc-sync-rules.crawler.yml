# .doc-sync-rules.yml — 爬虫项目预设
# 项目级文档同步纪律（由 mcpowers 体系的 mcpowers-doc-sync-install 技能注入）
#
# 本文件对应 mcpowers 最新版本的纪律。
# 后续访问：必须始终读取 mcpowers 最新版本（不写具体版本号，跨升级永久适用）。
# 版本演进历史在 mcpowers 仓库的 .claude-plugin/*.json 和 CHANGELOG.md。

# 规则 1：app/crawlers 下含 http/https URL 字符串的常量必须在 docs/targets.md 被提及
RULE_START crawler_targets
enabled=true
type=route_in_doc
code_dir=app/crawlers
code_ext=py
code_regex=https?://[a-zA-Z0-9./_-]+
doc_file=docs/targets.md
RULE_END

# 规则 2：.env 中代理/cookie 等敏感配置必须在 docs/config.md 中说明
RULE_START env_keys
enabled=true
type=env_in_doc
env_file=.env
code_regex=^([A-Z][A-Z0-9_]+)=
doc_file=docs/config.md
RULE_END

# 规则 3：README.md 中提到的 scripts/*.sh 路径必须真实存在
RULE_START readme_paths
enabled=true
type=path_in_doc
doc_file=README.md
RULE_END
