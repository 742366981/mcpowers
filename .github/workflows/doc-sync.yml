name: 文档与插件结构同步校验

# 触发条件：PR 涉及技能体系、Hook、插件元数据、校验脚本或技术规范变化时
on:
  pull_request:
    paths:
      - 'skills/**'
      - 'hooks/**'
      - '.claude-plugin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'skills/mcpowers-shared/docs/**'
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [master]

jobs:
  doc-sync:
    name: 文档 ↔ 代码同步校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 README ↔ 实际状态
        run: bash scripts/check-readme-sync.sh

      - name: 校验插件结构
        run: bash tests/plugin-verify.sh

      - name: 校验 CLAUDE.md / README.md 同步变更
        run: |
          # 当 PR 涉及技能体系核心路径时，要求 CLAUDE.md 或 README.md 至少有一个变化
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="origin/${{ github.base_ref }}"
            HEAD_SHA="${{ github.sha }}"

            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)

            # 受保护路径：技能体系核心目录
            PROTECTED_PATHS_REGEX='^(skills/|hooks/|\.claude-plugin/|skills/mcpowers-shared/docs/)'

            # 顶层用户/维护文档：CLAUDE.md / README.md / CHANGELOG.md / docs/历史教训.md
            DOCS_REGEX='^(CLAUDE\.md|README\.md|CHANGELOG\.md|docs/历史教训\.md)$'

            DOCS_CHANGED=$(echo "$CHANGED" | grep -E "$DOCS_REGEX" || true)
            PROTECTED_CHANGED=$(echo "$CHANGED" | grep -E "$PROTECTED_PATHS_REGEX" || true)

            if [ -n "$PROTECTED_CHANGED" ] && [ -z "$DOCS_CHANGED" ]; then
              echo "❌ 检测到技能体系变更但 CLAUDE.md / README.md / CHANGELOG.md / docs/历史教训.md 均未同步"
              echo ""
              echo "变更的受保护路径："
              echo "$PROTECTED_CHANGED"
              echo ""
              echo "按 CLAUDE.md「文档同步约束（强制）」+ v2.21.1 文档职责分工，"
              echo "能力变化必须同步以下 4 类顶层文档之一："
              echo "  - CLAUDE.md（AI 必备的执行规则 / 铁律 / 路由器索引）"
              echo "  - README.md（用户可见能力 / 安装 / 维护入口）"
              echo "  - CHANGELOG.md（用户视角版本变更）"
              echo "  - docs/历史教训.md（维护者复盘 / 关键决策 / 关键风险）"
              exit 1
            fi

            if [ -n "$PROTECTED_CHANGED" ]; then
              echo "✓ 检测到顶层用户/维护文档同步变更"
              echo "$DOCS_CHANGED"
            fi
          else
            echo "✓ push 事件，跳过文档同步变更检查"
          fi