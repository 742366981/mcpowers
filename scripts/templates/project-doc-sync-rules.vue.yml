# .doc-sync-rules.yml — Vue 项目预设
# 项目级文档同步纪律（由 mcpowers 体系的 mcpowers-doc-sync-install 技能注入）
#
# 本文件对应 mcpowers 最新版本的纪律。
# 后续访问：必须始终读取 mcpowers 最新版本（不写具体版本号，跨升级永久适用）。
# 版本演进历史在 mcpowers 仓库的 .claude-plugin/*.json 和 CHANGELOG.md。

# 规则 1：src/router 下所有 .ts 路由 path 必须在 docs/router.md 中被提及
RULE_START vue_routes
enabled=true
type=route_in_doc
code_dir=src/router
code_ext=ts
code_regex=path:[[:space:]]*['"]([^'"]+)['"]
doc_file=docs/router.md
RULE_END

# 规则 2：.env 中所有 KEY 必须在 README.md 中被提及
RULE_START env_keys
enabled=true
type=env_in_doc
env_file=.env
code_regex=^VUE_APP_([A-Z0-9_]+)=
doc_file=README.md
RULE_END

# 规则 3：README.md 中提到 scripts/*.sh / tools/*.ts 路径必须真实存在
RULE_START readme_paths
enabled=true
type=path_in_doc
doc_file=README.md
RULE_END
